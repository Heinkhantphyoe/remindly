name: Remindly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remindly
          POSTGRES_USER: remindly
          POSTGRES_PASSWORD: remindly_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remindly -d remindly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/remindly
          DATABASE_USERNAME: remindly
          DATABASE_PASSWORD: remindly_dev
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
      - run: mvn -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
