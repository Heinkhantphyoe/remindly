spring:
  application:
    name: remindly-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/remindly}
    username: ${DATABASE_USERNAME:remindly}
    password: ${DATABASE_PASSWORD:remindly_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:remindly-local-development-secret-key-change-me}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}

