spring:
  application:
    name: remindly-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/remindly}
    username: ${DATABASE_USERNAME:remindly}
    password: ${DATABASE_PASSWORD:remindly_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:remindly-local-development-secret-key-change-me}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

notifications:
  scheduler:
    fixed-rate-ms: ${NOTIFICATION_SCHEDULER_FIXED_RATE_MS:60000}
  recovery-window-hours: ${NOTIFICATION_RECOVERY_WINDOW_HOURS:24}

email:
  from: ${EMAIL_FROM:remindly@example.com}
  from-name: ${EMAIL_FROM_NAME:Remindly}
  app-url: ${EMAIL_APP_URL:http://localhost:5173}
  outbox:
    fixed-rate-ms: ${EMAIL_OUTBOX_FIXED_RATE_MS:60000}
    batch-size: ${EMAIL_OUTBOX_BATCH_SIZE:25}
    max-attempts: ${EMAIL_OUTBOX_MAX_ATTEMPTS:5}
    initial-backoff-seconds: ${EMAIL_OUTBOX_INITIAL_BACKOFF_SECONDS:60}
    max-backoff-seconds: ${EMAIL_OUTBOX_MAX_BACKOFF_SECONDS:3600}
    stale-processing-minutes: ${EMAIL_OUTBOX_STALE_PROCESSING_MINUTES:15}

